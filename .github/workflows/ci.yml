name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check

      - name: Run unit tests
        env:
          DATABASE_URL: "postgresql+psycopg://dummy:dummy@localhost:5432/dummy"
          DATABASE_URL_DIRECT: "postgresql+psycopg://dummy:dummy@localhost:5432/dummy"
          LLM_PROVIDER: "fake"
          SECRET_KEY: "dummy-secret-key-at-least-32-chars-long"
          JWT_SECRET: "dummy-jwt-secret-at-least-32-chars-long"
        run: pytest tests/unit

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run build
        run: npm run build
